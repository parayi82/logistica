<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torre de Control — Ingreso</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <form id="login-form" class="card login-card">
        <h1>Torre de Control</h1>
        <p>Ingresa con tu cuenta para monitorear los viajes activos.</p>

        <label for="email">Correo</label>
        <input id="email" type="email" autocomplete="username" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <div class="error" id="error"></div>

        <button type="submit" id="submit-btn">Ingresar</button>
      </form>
    </div>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
